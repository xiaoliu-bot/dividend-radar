<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>赞赏支持 · Thanks for Your Support</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --blue: #1971c2;
    --blue-soft: #e7f0fd;
    --wechat-green: #07c160;
    --alipay-blue: #1677ff;
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei",
      "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* 浅色背景装饰：柔和的蓝/琥珀光晕，保持与主站清爽风格一致 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(620px 420px at 12% 8%, rgba(25, 113, 194, 0.08) 0%, transparent 60%),
      radial-gradient(560px 400px at 88% 92%, rgba(7, 193, 96, 0.07) 0%, transparent 60%),
      radial-gradient(480px 360px at 95% 12%, rgba(232, 89, 12, 0.05) 0%, transparent 55%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 980px;
    margin: 0 auto;
    padding: 64px 24px 48px;
  }

  /* 头部 */
  header {
    text-align: center;
    margin-bottom: 56px;
    animation: fadeInUp 0.8s ease-out both;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    background: var(--blue-soft);
    border: 1px solid rgba(25, 113, 194, 0.18);
    border-radius: 999px;
    font-size: 13px;
    color: var(--blue);
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }

  .badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 8px rgba(25, 113, 194, 0.6);
    animation: pulse 2s ease-in-out infinite;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 2.6rem);
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 16px;
    color: var(--text);
  }

  .subtitle {
    font-size: clamp(0.95rem, 1.6vw, 1.1rem);
    color: var(--muted);
    max-width: 560px;
    margin: 0 auto;
  }

  /* 二维码区域 */
  .qr-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 28px;
    margin-bottom: 48px;
  }

  .qr-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 32px 24px 24px;
    text-align: center;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.4s ease,
                border-color 0.4s ease;
    overflow: hidden;
    animation: fadeInUp 0.8s ease-out both;
  }

  .qr-card:nth-child(1) { animation-delay: 0.1s; }
  .qr-card:nth-child(2) { animation-delay: 0.2s; }

  .qr-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 18px;
    padding: 1px;
    background: linear-gradient(135deg, transparent 0%, var(--glow, transparent) 50%, transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .qr-card:hover {
    transform: translateY(-6px);
    border-color: rgba(25, 113, 194, 0.35);
    box-shadow: 0 18px 48px -12px rgba(25, 113, 194, 0.25);
  }

  .qr-card:hover::before { opacity: 1; }

  .qr-card.wechat { --glow: rgba(7, 193, 96, 0.5); }
  .qr-card.alipay { --glow: rgba(22, 119, 255, 0.5); }

  .card-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  }

  .wechat .card-icon {
    background: linear-gradient(135deg, #07c160 0%, #00a854 100%);
  }

  .alipay .card-icon {
    background: linear-gradient(135deg, #1677ff 0%, #0e5fd9 100%);
  }

  .card-icon svg {
    width: 28px;
    height: 28px;
    fill: #fff;
  }

  .card-title {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--text);
  }

  .card-sub {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .qr-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 28px rgba(17, 24, 39, 0.08);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .qr-card:hover .qr-wrap {
    transform: scale(1.04);
  }

  .qr-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 8px;
  }

  /* 角落的扫描提示 */
  .scan-hint {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 18px;
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
  }

  .scan-hint::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    animation: pulse 1.6s ease-in-out infinite;
  }

  .wechat .scan-hint { color: #07a050; }
  .alipay .scan-hint { color: #1677ff; }

  /* 文案区 */
  .note {
    text-align: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px 24px;
    box-shadow: 0 6px 20px rgba(17, 24, 39, 0.05);
    animation: fadeInUp 0.8s 0.3s ease-out both;
  }

  .note p {
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.8;
    max-width: 640px;
    margin: 0 auto;
  }

  .note .em {
    color: var(--blue);
    font-weight: 600;
  }

  /* 底部 */
  footer {
    margin-top: 40px;
    text-align: center;
    color: #9aa3af;
    font-size: 0.8rem;
    letter-spacing: 0.5px;
  }

  /* 动画 */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(1.3); }
  }

  /* 响应式 */
  @media (max-width: 640px) {
    .container { padding: 40px 16px 32px; }
    header { margin-bottom: 36px; }
    .qr-wrap { width: 200px; height: 200px; }
    .qr-card { padding: 26px 18px 20px; }
  }
</style>
</head>
<body>

<div class="container">

  <header>
    <span class="badge"><span class="dot"></span>支持创作者</span>
    <h1>感谢您的支持</h1>
    <p class="subtitle">如果我的内容对你有所帮助或启发，欢迎扫码赞赏，让创作继续发生 ✨</p>
  </header>

  <section class="qr-grid">

    <!-- 微信赞赏码 -->
    <div class="qr-card wechat">

      </div>
      <div class="scan-hint">长按或扫码识别</div>
    </div>

    <!-- 支付宝 -->
    <div class="qr-card alipay">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">

      <div class="card-title">支付宝</div>
      <div class="card-sub">Alipay</div>
      <div class="qr-wrap">
        <img src="assets/alipay.jpg" alt="支付宝收款码" />
      </div>
      <div class="scan-hint">打开支付宝扫一扫</div>
    </div>

  </section>

  <div class="note">
    <p>
      每一份支持，都是继续写下去的理由。<br />
      你的 <span class="em">鼓励</span>，
      会化作深夜里的一杯咖啡、一盏亮到凌晨的灯。☕🌙
    </p>
  </div>

  <footer>
    Made with ♥ · Thank you for being here
  </footer>

</div>

</body>
</html>
