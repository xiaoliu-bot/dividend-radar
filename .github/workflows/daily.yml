name: 每日更新高股息雷达

on:
  schedule:
    # 北京时间 16:30（UTC 08:30），A 股收盘后半小时，周一到周五
    - cron: '30 8 * * 1-5'
    # 北京时间 21:00（UTC 13:00）补跑一次，防止收盘后数据尚未同步完整
    - cron: '0 13 * * 1-5'
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 跳过非交易日
        id: tradeday
        run: |
          python - <<'EOF'
          import datetime, os, sys
          # GitHub Actions 用 UTC，换算成北京时间判断星期
          bj = datetime.datetime.utcnow() + datetime.timedelta(hours=8)
          skip = bj.weekday() >= 5
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
          print(f"北京时间 {bj:%Y-%m-%d %H:%M}，{'周末跳过' if skip else '正常执行'}")
          EOF

      - name: 构建数据
        if: steps.tradeday.outputs.skip == 'false'
        run: python scripts/build_data.py --top 50 --workers 6
        env:
          DR_NO_CACHE: '1'

      - name: 检查产物
        if: steps.tradeday.outputs.skip == 'false'
        run: |
          ls -lh web/data/
          python -c "import json;d=json.load(open('web/data/stocks.json',encoding='utf-8'));print('标的数量:',len(d['stocks']));print('交易日:',d['trade_date'])"

      - name: 提交数据变更
        if: steps.tradeday.outputs.skip == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/stocks.json
          git diff --staged --quiet || git commit -m "chore: 更新股票数据 $(date -u -d '+8 hours' +'%Y-%m-%d %H:%M')"
          git push
        continue-on-error: true

      - name: 打包 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
